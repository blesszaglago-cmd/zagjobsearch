name: Security checks
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dependency-and-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install pinned audit tools
        run: python -m pip install pip-audit==2.10.1 bandit==1.9.4
      - name: Audit frontend runtime dependencies
        run: npm --prefix frontend audit --omit=dev --audit-level=high
      - name: Audit locked backend dependencies
        run: pip-audit -r backend/requirements.lock --no-deps --disable-pip --strict
      - name: Audit optional local restore dependencies
        run: pip-audit -r scripts/requirements-restore.txt --strict
      - name: Scan backend source
        run: bandit -q -r backend -x backend/tests --severity-level medium --confidence-level medium
      - name: Scan local restore helper
        run: bandit -q scripts/restore_backup.py --severity-level medium --confidence-level medium
