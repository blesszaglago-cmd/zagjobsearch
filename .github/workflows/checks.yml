name: Quality checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r backend/requirements.txt
      - name: Regression tests
        run: python -m unittest discover -s backend/tests -v
        env:
          PYTHONPATH: backend
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SECRET_KEY: test-only-no-network
          SESSION_SECRET: ci-only-not-a-production-secret
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: node node_modules/eslint/bin/eslint.js app components lib next.config.ts --quiet
      - run: npm run test:security
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          BACKEND_API_URL: https://zagjobsearch-api.vercel.app
