name: Quality checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backup-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
        env:
          POSTGRES_PASSWORD: restore-ci-only-password
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r backend/requirements.txt -r scripts/requirements-restore.txt
      - name: Verify restore dependencies
        run: python -m pip check
      - name: Restore synthetic snapshots into disposable PostgreSQL
        run: python -m unittest discover -s backend/tests -p 'test_restore*.py' -v
        env:
          PYTHONPATH: backend
          RESTORE_INTEGRATION_TESTS: "1"
          RESTORE_TEST_PASSWORD: restore-ci-only-password
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r backend/requirements.txt
      - name: Regression tests
        run: python -m unittest discover -s backend/tests -v
        env:
          PYTHONPATH: backend
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SECRET_KEY: test-only-no-network
          SESSION_SECRET: ci-only-not-a-production-secret
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: node node_modules/eslint/bin/eslint.js app components lib next.config.ts --quiet
      - run: npm run test:security
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          BACKEND_API_URL: https://zagjobsearch-api.vercel.app
