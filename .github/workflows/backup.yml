name: Encrypted application backup
on:
  schedule:
    - cron: "13 4 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_BACKUP_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_BACKUP_SERVICE_KEY }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require owner configuration
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SECRET_KEY" ] || [ -z "$BACKUP_ENCRYPTION_KEY" ]; then
            echo 'Backup secrets are not configured. See docs/operations.md.'
            exit 1
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install cryptography==50.0.2
      - run: python scripts/backup.py create application-backup.enc
      - run: python scripts/backup.py verify application-backup.enc
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: encrypted-application-backup-${{ github.run_id }}
          path: application-backup.enc
          retention-days: 7
          if-no-files-found: error
